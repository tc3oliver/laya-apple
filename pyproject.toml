[project]
name = "laya-apple"
version = "1.0.2"
description = "Correctness-validated heterogeneous Laya runtime for Apple Silicon (MLX GPU + Apple Neural Engine)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "oliver", email = "tc3oliver@gmail.com" }
]
requires-python = ">=3.11,<3.14"
keywords = ["laya", "apple-silicon", "mlx", "coreml", "apple-neural-engine", "ane", "inference", "heterogeneous-computing", "machine-learning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Environment :: GPU",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# MLX is the default backend, so it is the only engine in the base install.
dependencies = [
    "mlx>=0.32.2,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26",
    "tokenizers>=0.21,<1",
    "huggingface-hub>=0.34,<2",
    "safetensors>=0.6",
]

[project.optional-dependencies]
# Core ML runtime for the Neural Engine path. coremltools 9.0 was the version validated
# in Phase -1 and breaks on NumPy >= 2.5; NumPy < 2.2 is the tested range.
ane = ["coremltools==9.0", "numpy>=1.26,<2.2"]
# Building ANE artifacts (conversion + parity gate).
convert = ["coremltools==9.0", "numpy>=1.26,<2.2", "torch==2.7.0"]
# Regenerating the PyTorch FP32 goldens with unmodified upstream Laya.
reference = ["torch==2.7.0", "transformers==5.17.0", "laya==0.3.5"]
dev = ["pytest>=8", "ruff>=0.12", "psutil>=6"]

[project.scripts]
laya-apple = "laya_apple.cli:main"

[project.urls]
Homepage = "https://github.com/tc3oliver/laya-apple"
Documentation = "https://github.com/tc3oliver/laya-apple/blob/main/docs/guide.md"
Changelog = "https://github.com/tc3oliver/laya-apple/blob/main/CHANGELOG.md"
Issues = "https://github.com/tc3oliver/laya-apple/issues"
Repository = "https://github.com/tc3oliver/laya-apple"
Upstream = "https://github.com/NandhaKishorM/laya"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs downloaded checkpoints (HF cache)",
    "parity: full parity against the PyTorch FP32 goldens (slow, needs checkpoints)",
    "ane: needs coremltools and built ANE artifacts",
    "stress: long-running reliability/soak tests (LAYA_APPLE_STRESS=1)",
]

[tool.ruff]
line-length = 120
extend-exclude = ["research"]

[tool.ruff.format]
# Vendored upstream code stays byte-identical to its source revision (see NOTICE).
exclude = ["laya_apple/models/modernbert_mlx.py", "laya_apple/conversion/torch_reference.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
