<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-labelledby="title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">laya-apple serve beside a busy local LLM, one run on Apple M4 Max with Qwen3.8-27B-oQ4e-mtp: short-decision P99 47.2 ms with serve auto against 122.3 ms with --device gpu while the LLM generates (43.2 and 55.9 ms with the LLM idle); LLM throughput 42.2 tok/s alone, 40.0 beside serve --device gpu and 40.5 beside serve auto</title>
<style>
.bg{fill:#ffffff;stroke:#d1d9e0}
.t{fill:#1f2328}.m{fill:#59636e}.acc{fill:#0969da}.gpu{fill:#8c959f}
.box{fill:#f6f8fa;stroke:#d1d9e0}.boxacc{fill:#ddf4ff;stroke:#0969da}
.ln{stroke:#59636e;fill:none}.lnacc{stroke:#0969da;fill:none}.grid{stroke:#d1d9e0}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#3d444d}
.t{fill:#e6edf3}.m{fill:#9198a1}.acc{fill:#4493f8}.gpu{fill:#656c76}
.box{fill:#151b23;stroke:#3d444d}.boxacc{fill:#0c2d6b;stroke:#4493f8}
.ln{stroke:#9198a1}.lnacc{stroke:#4493f8}.grid{stroke:#3d444d}
}
</style>
<rect x="0.5" y="0.5" width="879" height="439" rx="10" class="bg"/>
<text x="24" y="34" class="t" font-size="18" font-weight="600">laya-apple serve beside a busy local LLM</text>
<text x="24" y="58" class="m" font-size="13">Decisions at 8 req/s offered (80% short) beside a saturated LLM · serve auto sends most short decisions to the Neural Engine</text>
<text x="24" y="96" class="t" font-size="14" font-weight="600">Short-decision P99 latency, ms (lower is better)</text>
<text x="24" y="124.5" class="m" font-size="12">serve --device gpu · LLM idle</text>
<rect x="260" y="112" width="196.4" height="16" rx="2" class="gpu" fill-opacity="0.45"/>
<text x="464.355" y="124.5" class="m" font-size="12">55.9 ms</text>
<text x="24" y="152.5" class="t" font-size="12">serve --device gpu · LLM busy</text>
<rect x="260" y="140" width="430.0" height="16" rx="2" class="gpu"/>
<text x="698" y="152.5" class="t" font-size="12">122.3 ms</text>
<text x="24" y="180.5" class="m" font-size="12">serve auto · LLM idle</text>
<rect x="260" y="168" width="151.8" height="16" rx="2" class="acc" fill-opacity="0.45"/>
<text x="419.848" y="180.5" class="m" font-size="12">43.2 ms</text>
<text x="24" y="208.5" class="t" font-size="12">serve auto · LLM busy</text>
<rect x="260" y="196" width="165.9" height="16" rx="2" class="acc"/>
<text x="433.865" y="208.5" class="t" font-size="12">47.2 ms</text>
<line x1="24" x2="856" y1="240" y2="240" class="grid"/>
<text x="24" y="268" class="t" font-size="14" font-weight="600">Local LLM generation throughput, tok/s (higher is better; bars start at 0)</text>
<text x="24" y="296.5" class="t" font-size="12">LLM alone</text>
<rect x="260" y="284" width="430.0" height="16" rx="2" class="m"/>
<text x="698" y="296.5" class="t" font-size="12">42.2 tok/s</text>
<text x="24" y="324.5" class="t" font-size="12">LLM + serve --device gpu</text>
<rect x="260" y="312" width="407.0" height="16" rx="2" class="gpu"/>
<text x="674.997" y="324.5" class="t" font-size="12">40.0 tok/s (−5.3%)</text>
<text x="24" y="352.5" class="t" font-size="12">LLM + serve auto</text>
<rect x="260" y="340" width="412.6" height="16" rx="2" class="acc"/>
<text x="680.612" y="352.5" class="t" font-size="12">40.5 tok/s (−4.0%)</text>
<line x1="24" x2="856" y1="376" y2="376" class="grid"/>
<text x="24" y="400" class="m" font-size="12">One run (m4-max-r2) on Apple M4 Max · macOS 26.6.2 · LLM Qwen3.8-27B-oQ4e-mtp · serve --model laya</text>
<text x="24" y="420" class="m" font-size="12">Medians over 4 windows of 60 s per cell (9 for the LLM alone); P99 from scheduled arrival, queueing included</text>
</svg>
