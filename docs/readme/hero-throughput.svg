<svg xmlns="http://www.w3.org/2000/svg" width="880" height="362" viewBox="0 0 880 362" role="img" aria-labelledby="title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Mixed-workload throughput, GPU-only vs GPU + ANE: laya 41.9 to 122.5 req/s (2.92×), laya-multilingual 55.7 to 241.8 req/s (4.34×), laya-typed-decisions 24.0 to 109.6 req/s (4.57×)</title>
<style>
.bg{fill:#ffffff;stroke:#d1d9e0}
.t{fill:#1f2328}.m{fill:#59636e}.acc{fill:#0969da}.gpu{fill:#8c959f}
.box{fill:#f6f8fa;stroke:#d1d9e0}.boxacc{fill:#ddf4ff;stroke:#0969da}
.ln{stroke:#59636e;fill:none}.lnacc{stroke:#0969da;fill:none}.grid{stroke:#d1d9e0}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#3d444d}
.t{fill:#e6edf3}.m{fill:#9198a1}.acc{fill:#4493f8}.gpu{fill:#656c76}
.box{fill:#151b23;stroke:#3d444d}.boxacc{fill:#0c2d6b;stroke:#4493f8}
.ln{stroke:#9198a1}.lnacc{stroke:#4493f8}.grid{stroke:#3d444d}
}
</style>
<rect x="0.5" y="0.5" width="879" height="361" rx="10" class="bg"/>
<text x="24" y="34" class="t" font-size="18" font-weight="600">laya-apple: mixed-workload throughput against GPU-only serving</text>
<text x="24" y="58" class="m" font-size="13">Heterogeneous MLX GPU + Apple Neural Engine serving · ANE paths parity-validated against upstream Laya</text>
<rect x="24" y="76" width="12" height="12" rx="2" class="gpu"/>
<text x="42" y="87" class="m" font-size="12">GPU-only (MLX)</text>
<rect x="150" y="76" width="12" height="12" rx="2" class="acc"/>
<text x="168" y="87" class="m" font-size="12">GPU + ANE (laya-apple)</text>
<text x="856" y="87" class="m" font-size="12" text-anchor="end">throughput gain</text>
<line x1="24" x2="856" y1="100" y2="100" class="grid"/>
<text x="24" y="137" class="t" font-size="14" font-weight="600">laya</text>
<rect x="196" y="112" width="76.2" height="16" rx="2" class="gpu"/>
<text x="280.22" y="124.5" class="m" font-size="12">41.9 req/s</text>
<rect x="196" y="134" width="222.9" height="16" rx="2" class="acc"/>
<text x="426.916" y="146.5" class="t" font-size="12">122.5 req/s</text>
<text x="856" y="142" class="acc" font-size="28" font-weight="700" text-anchor="end">2.92×</text>
<line x1="24" x2="856" y1="166" y2="166" class="grid"/>
<text x="24" y="203" class="t" font-size="14" font-weight="600">laya-multilingual</text>
<rect x="196" y="178" width="101.4" height="16" rx="2" class="gpu"/>
<text x="305.442" y="190.5" class="m" font-size="12">55.7 req/s</text>
<rect x="196" y="200" width="440.0" height="16" rx="2" class="acc"/>
<text x="644" y="212.5" class="t" font-size="12">241.8 req/s</text>
<text x="856" y="208" class="acc" font-size="28" font-weight="700" text-anchor="end">4.34×</text>
<line x1="24" x2="856" y1="232" y2="232" class="grid"/>
<text x="24" y="269" class="t" font-size="14" font-weight="600">laya-typed-decisions</text>
<rect x="196" y="244" width="43.7" height="16" rx="2" class="gpu"/>
<text x="247.652" y="256.5" class="m" font-size="12">24.0 req/s</text>
<rect x="196" y="266" width="199.4" height="16" rx="2" class="acc"/>
<text x="403.39" y="278.5" class="t" font-size="12">109.6 req/s</text>
<text x="856" y="274" class="acc" font-size="28" font-weight="700" text-anchor="end">4.57×</text>
<line x1="24" x2="856" y1="298" y2="298" class="grid"/>
<text x="24" y="324" class="m" font-size="12">One short and one long request stream per model through one Laya(execution=&quot;workers&quot;) instance; GPU-only runs both on the MLX worker.</text>
<text x="24" y="344" class="m" font-size="12">Measured on Apple M4 Max · macOS 26.6.2</text>
</svg>
