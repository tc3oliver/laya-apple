name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev --extra serve

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check laya_apple scripts tests

      - name: Fast tests
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          export LAYA_APPLE_CACHE="$RUNNER_TEMP/laya-apple-cache"
          uv run pytest -q -m "not integration and not parity and not ane and not stress"

      - name: Data-drift checks
        run: |
          uv run python scripts/derive_routing.py --check
          uv run python scripts/derive_placement.py --check
          uv run python scripts/make_goldens.py --check
          uv run python scripts/generate_readme_svgs.py --check
